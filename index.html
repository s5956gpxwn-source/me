<!doctype html>
<html lang="ar" dir="rtl" data-design="aurora" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0e27" />
    <meta name="description" content="Personal portfolio — showcasing work, projects and social presence." />
    <meta property="og:title" content="Your Name — Portfolio" />
    <meta property="og:description" content="Personal portfolio site." />
    <meta property="og:type" content="website" />

    <title>Your Name — Portfolio</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1' y1='0' y2='1'%3E%3Cstop offset='0' stop-color='%23a855f7'/%3E%3Cstop offset='1' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23g)'/%3E%3C/svg%3E" />

    <script>
      // Early theme/design application to avoid flash of unstyled content.
      (function () {
        try {
          var root = document.documentElement;
          var savedDesign = localStorage.getItem('design');
          var savedTheme = localStorage.getItem('theme');
          var savedLocale = localStorage.getItem('locale');
          if (savedDesign) root.dataset.design = savedDesign;
          if (savedTheme) root.dataset.theme = savedTheme;
          if (savedLocale) {
            root.lang = savedLocale;
            root.dir = savedLocale === 'ar' ? 'rtl' : 'ltr';
          }
        } catch (e) {}
      })();
    </script>

    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div id="app"></div>

    <div id="cursor" class="cursor" aria-hidden="true"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
